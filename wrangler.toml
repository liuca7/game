name = "my-weird-semester"
main = "src/index.js"
compatibility_date = "2026-09-21"

# ============================================================
# 部署前必读（重要）
# 1. 创建 D1 数据库：
#      npx wrangler d1 create weird-semester
#    把输出中的 database_id 粘贴到下方对应字段。
# 2. 初始化表结构：
#      npm run db:init:remote
# 3. 部署：
#      npm run deploy
# 部署完成后访问 https://my-weird-semester.<你的子域>.workers.dev
# ============================================================

# 前端静态资源（public/ 目录），由 Workers Assets 自动托管
assets = { directory = "./public", binding = "ASSETS" }

# D1 数据库（排行榜存储）
[[d1_databases]]
binding = "DB"
database_name = "weird-semester"
database_id = "91261288-69f2-4d5d-8a62-0896f7f3309a"  # ← 替换为你的真实 database_id
